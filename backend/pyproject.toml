[project]
name = "instantlify-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.18.2,<3.19",
  "djangorestframework-simplejwt>=5.5,<6",
  "celery[redis]>=5.6,<5.7",
  "redis>=5.2,<7",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<0.5",
  "cryptography>=50,<51",
  "dj-database-url>=3,<4",
  "httpx>=0.28,<0.29",
  "gunicorn>=23,<26",
  "flower>=2,<3",
  "channels>=4.3,<5",
  "channels-redis>=4.3,<5",
  "uvicorn[standard]>=0.35,<1",
  "langgraph>=1.2.14,<2",
  "langgraph-sdk>=0.4.6,<0.5",
  "certifi>=2026.10.18",
  "msgpack>=1.2.3,<2",
  "PyJWT>=2.15,<3",
  "tornado>=6.6,<7",
  "urllib3>=2.8,<3",
  "stripe>=12,<16",
  "sentry-sdk>=2,<3",
  "pypdf>=6.21.4,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_dns: do not mock outbound URL validation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
