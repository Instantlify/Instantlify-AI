    build: *ref_0
    init: true
    restart: unless-stopped
    command:
      - uvicorn
      - config.asgi:application
      - '--host'
      - 0.0.0.0
      - '--port'
      - '8000'
      - '--workers'
      - '2'
      - '--no-access-log'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - '-c'
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
    environment: *ref_1
  worker:
    build: *ref_0
    init: true
    restart: unless-stopped
    command:
      - celery
      - '-A'
      - config
      - worker
      - '--loglevel=INFO'
      - '--concurrency=2'
      - '--hostname=worker@%h'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A config inspect ping --destination "worker@$$HOSTNAME" --timeout 5 | grep -q pong
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 5
    environment: *ref_1
  beat:
    build: *ref_0
    init: true
    restart: unless-stopped
    command:
      - celery
      - '-A'
      - config
      - beat
      - '--loglevel=INFO'
      - '--schedule=/tmp/celerybeat-schedule'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *ref_1
  flower:
    build: *ref_0
    init: true
    restart: unless-stopped
    command:
      - celery
      - '-A'
      - config
      - flower
      - '--port=5555'
    depends_on:
      redis:
        condition: service_healthy
