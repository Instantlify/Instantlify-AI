name: Branch policy

# Metadata only: never check out or execute pull-request code here.
on:
  pull_request_target:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Enforce work branch to dev to main
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        shell: node {0}
        run: |
          const { BASE_BRANCH: base, HEAD_BRANCH: head,
            HEAD_REPOSITORY: source, BASE_REPOSITORY: target } = process.env;
          // Work branches that may target dev, named <prefix>/<description>.
          const prefixes = ['feature', 'fix', 'bugfix', 'refactor', 'upgrade'];
          const allowed = prefixes.map((prefix) => prefix + '/*').join(', ');
          let error;
          if (source !== target) {
            error = 'The source branch must belong to this repository.';
          } else if (base === 'main') {
            if (head !== 'dev') error = 'Only dev may open a pull request into main.';
          } else if (base === 'dev') {
            const prefix = prefixes.find((name) => head?.startsWith(name + '/'));
            if (!prefix || head.length <= prefix.length + 1) {
              error = 'Only ' + allowed + ' branches may open a pull request into dev.';
            }
          } else {
            error = 'Unexpected target branch.';
          }
          if (error) {
            console.error('::error::' + error);
            process.exit(1);
          }
          console.log('Source branch policy passed.');
