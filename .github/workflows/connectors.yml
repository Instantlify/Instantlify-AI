name: Connectors
# Validate the Zapier, n8n and Make packages on every change to them, and release them
# when a `connectors-vX.Y.Z` tag is pushed. App releases do not publish connectors.
on:
  pull_request:
    paths: ['connectors/**']
  push:
    branches: [main]
    paths: ['connectors/**']
    tags: ['connectors-v*']
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Tests, `zapier validate`, the n8n build and `npm pack`, and the Make schema check.
      - run: python connectors/scripts/publish.py check

  release:
    if: startsWith(github.ref, 'refs/tags/connectors-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the Make bundle to the GitHub release
    environment: connectors-release # holds the secrets; add required reviewers there
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version from tag
        run: echo "VERSION=${VERSION#connectors-v}" >> "$GITHUB_ENV"
      - name: n8n community node to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python connectors/scripts/publish.py n8n --version "$VERSION" --publish
      - name: Zapier private version (promote after review)
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: python connectors/scripts/publish.py zapier --version "$VERSION" --push
      - name: Make bundle on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python connectors/scripts/publish.py make
          gh release create "$GITHUB_REF_NAME" --title "Connectors $VERSION" --notes \
            "Upload nemio-make-app.zip in Make's developer platform." \
            connectors/dist/nemio-make-app.zip || \
          gh release upload "$GITHUB_REF_NAME" connectors/dist/nemio-make-app.zip --clobber
