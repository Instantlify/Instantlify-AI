# Nemio behind nginx: the alternative to deploy/Caddyfile when TLS terminates elsewhere
# (a cloud load balancer) or nginx is already the house proxy. Mounted as
# /etc/nginx/conf.d/nemio.conf. Replace app.nemio.ai / ops.nemio.ai and certificate paths.

upstream nemio_backend  { server backend:8000;  keepalive 32; }
upstream nemio_frontend { server frontend:3000; keepalive 16; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Webhook ingress: generous per source address (Meta sends bursts from few IPs), but a
# flood is dropped at the edge before it reaches Django.
limit_req_zone $binary_remote_addr zone=nemio_webhooks:10m rate=50r/s;

server {
    listen 80;
    server_name app.nemio.ai ops.nemio.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.nemio.ai;

    ssl_certificate     /etc/nginx/certs/app.nemio.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/app.nemio.ai/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # Django's SECURE_PROXY_SSL_HEADER
    proxy_set_header Connection        "";

    # Provider webhooks (Meta, Telegram, Stripe).
    location /webhooks/ {
        limit_req zone=nemio_webhooks burst=200 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://nemio_backend;
    }

    # Inbox live updates over WebSocket.
    location /ws/ {
        proxy_pass http://nemio_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Signed voice-note URLs fetched by Meta/Telegram: stream, do not buffer.
    location /media/voice/ {
        proxy_pass http://nemio_backend;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # API (including the MCP server) and health checks.
    location /api/    { proxy_pass http://nemio_backend; client_max_body_size 12m; }
    location /health/ { proxy_pass http://nemio_backend; }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://nemio_frontend;
        proxy_set_header Upgrade    $http_upgrade;       # Next dev/HMR, harmless in prod
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ops.nemio.ai;

    ssl_certificate     /etc/nginx/certs/ops.nemio.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/ops.nemio.ai/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    location / {
        proxy_pass http://nemio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
